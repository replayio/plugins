<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Replay recordings</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; background: #101014; color: #d8d8de; font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
  main { max-width: 1100px; margin: 0 auto; padding: 28px 20px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  p.sub { margin: 0 0 20px; color: #8a8a96; }
  .wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid #23232b; vertical-align: middle; }
  th { color: #8a8a96; font-weight: 500; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
  td.url { max-width: 340px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #9a9aa6; }
  td.num { font-variant-numeric: tabular-nums; }
  .live { color: #F02D5E; font-weight: 600; }
  a, button { color: #ddd; background: #2a2a33; border: 0; border-radius: 4px; padding: 5px 10px; cursor: pointer;
    font: inherit; font-size: 13px; text-decoration: none; display: inline-block; }
  a.play { background: #F02D5E; color: #fff; }
  a:hover, button:hover { filter: brightness(1.2); }
  .actions { display: flex; gap: 6px; flex-wrap: wrap; }
  .status { font-size: 12px; color: #8a8a96; }
  .err { color: #ff8a9a; }
  .replay { display: flex; flex-direction: column; gap: 4px; font-size: 12px; }
  .replay a.rec { background: #23324d; color: #9cc0ff; }
  .muted { color: #6f6f7a; font-size: 12px; }
  code { font-size: 12px; color: #9a9aa6; }
</style>
</head>
<body>
<main>
  <h1>Replay recordings</h1>
  <p class="sub">Every browser session Claude opened: the rrweb stream for watching, and the Replay recording for time-travel debugging.</p>
  <div class="wrap"><table>
    <thead><tr><th>When</th><th>Session</th><th>Page</th><th>Length</th><th>Events</th><th>Replay recording</th><th></th></tr></thead>
    <tbody id="rows"><tr><td colspan="6">Loading…</td></tr></tbody>
  </table></div>
</main>
<script>
(async () => {
  const token = new URLSearchParams(location.search).get('token')
  const q = `token=${encodeURIComponent(token)}`
  const clock = ms => { const s = Math.round(ms / 1000); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}` }
  const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]))
  const list = await (await fetch(`/recordings?all=1&${q}`)).json()
  const rows = document.getElementById('rows')
  if (!list.length) { rows.innerHTML = '<tr><td colspan="7">No recordings yet.</td></tr>'; return }
  const replayCell = r => {
    const recs = r.replay || []
    if (!recs.length) return `<span class="muted">none linked</span> <button data-find="${encodeURIComponent(r.id)}">Find</button>`
    return recs.map(x => x.uploadStatus === 'uploaded'
      ? `<a class="rec" href="${esc(x.url)}" target="_blank" title="${esc(x.uri)}">Open ${esc(x.id.slice(0, 8))} in Replay</a>`
      : `<span><code>${esc(x.id.slice(0, 8))}</code> ${esc(x.recordingStatus || '')}</span>`).join('')
      + (recs.some(x => x.uploadStatus !== 'uploaded') ? ` <button data-upload="${encodeURIComponent(r.id)}">⇪ Upload</button>` : '')
  }
  rows.innerHTML = list.map(r => {
    const id = encodeURIComponent(r.id)
    return `<tr>
      <td>${r.startedAt ? new Date(r.startedAt).toLocaleString() : ''}</td>
      <td>${esc(r.session)} ${r.status === 'live' ? '<span class="live">● live</span>' : ''}</td>
      <td class="url" title="${esc(r.url)}">${esc(r.url)}</td>
      <td class="num">${clock(r.durationMs)}</td>
      <td class="num">${r.eventCount.toLocaleString()}</td>
      <td><div class="replay" id="r-${esc(r.id)}">${replayCell(r)}</div></td>
      <td><div class="actions">
        <a class="play" href="/player/${id}?mode=auto&chrome=1&${q}">▶ Play</a>
        <a href="/recordings/${id}/rrweb.json?${q}">rrweb.json</a>
        <button data-export="${id}">Save MP4</button>
      </div><div class="status" id="s-${esc(r.id)}"></div></td>
    </tr>`
  }).join('')
  const replayAction = async (button, id, method, path) => {
    const cell = document.getElementById(`r-${decodeURIComponent(id)}`)
    button.disabled = true
    button.textContent = method === 'POST' ? 'Uploading…' : 'Finding…'
    const res = await fetch(`/recordings/${id}/${path}?${q}`, { method })
    const body = await res.json()
    if (!res.ok) { cell.innerHTML = `<span class="err">${esc(body.error)}</span>`; return }
    const r = list.find(x => x.id === decodeURIComponent(id))
    r.replay = body
    cell.innerHTML = replayCell(r)
    wire(cell)
  }
  const wire = root => {
    for (const b of root.querySelectorAll('[data-upload]')) b.onclick = () => replayAction(b, b.dataset.upload, 'POST', 'replay/upload')
    for (const b of root.querySelectorAll('[data-find]')) b.onclick = () => replayAction(b, b.dataset.find, 'GET', 'replay')
  }
  wire(document)
  for (const button of document.querySelectorAll('[data-export]')) {
    button.onclick = async () => {
      const id = button.dataset.export
      const status = document.getElementById(`s-${decodeURIComponent(id)}`)
      button.disabled = true
      await fetch(`/recordings/${id}/export?${q}`, { method: 'POST', body: '{}' })
      const poll = async () => {
        const job = await (await fetch(`/recordings/${id}/export?${q}`)).json()
        if (!job) return
        if (job.status === 'running') { status.textContent = `Rendering… ${Math.round(job.progress * 100)}%`; return setTimeout(poll, 700) }
        button.disabled = false
        status.className = job.status === 'failed' ? 'status err' : 'status'
        status.textContent = job.status === 'failed' ? job.error : `Saved ${job.files.join(', ')}`
      }
      poll()
    }
  }
})()
</script>
</body>
</html>
