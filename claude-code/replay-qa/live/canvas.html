<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Replay QA canvas</title>
<style>
  :root { color-scheme: dark; --accent: #F02D5E; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #101014; color: #d8d8de;
    font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
  /* The grid sits on a pannable, zoomable surface: driven by the pointer in a browser, by the
     terminal through window.__canvas in the screencast (embed). */
  body { height: 100vh; overflow: hidden; display: flex; flex-direction: column; }
  header#head { flex: none; }
  #viewport { position: relative; flex: 1; min-height: 0; overflow: hidden; touch-action: none; cursor: grab;
    background: #101014 radial-gradient(#23232b 1px, transparent 1px) 0 0 / 24px 24px; }
  #viewport.panning { cursor: grabbing; }
  #world { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
  #world.glide { transition: transform .22s ease-out; }
  .zoom { display: flex; align-items: center; gap: 2px; }
  .zoom button { min-width: 30px; }
  #zoomPct { min-width: 58px; font-variant-numeric: tabular-nums; }
  #hint { position: absolute; left: 12px; bottom: 10px; color: #5f5f6b; font-size: 12px; pointer-events: none; user-select: none;
    max-width: calc(100% - 260px); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #minimap { position: absolute; right: 12px; bottom: 12px; border: 1px solid #34343f; border-radius: 6px;
    background: rgba(16,16,20,.88); cursor: pointer; touch-action: none; }
  /* In the terminal the picture is the canvas alone: the pane draws the project header and the hint. */
  body.embed header#head, body.embed #hint { display: none; }
  body.embed { font-size: 17px; }
  header#head { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; padding: 14px 20px;
    border-bottom: 1px solid #23232b; position: sticky; top: 0; background: #101014; z-index: 5; }
  .proj { font-size: 17px; font-weight: 700; }
  .live-count { color: var(--accent); font-weight: 600; display: none; }
  .live-count.on { display: inline; }
  .live-count i, .dot.live { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--accent); animation: pulse 1.2s infinite; margin-right: 6px; }
  .count { color: #8a8a96; }
  .count b { color: #d8d8de; font-weight: 600; }
  .server { color: #8a8a96; font-size: 12px; padding: 2px 8px; border: 1px solid #2f2f39; border-radius: 10px; display: none; }
  .server.on { display: inline; }
  .spacer { flex: 1; }
  .chips, .actions { display: flex; gap: 6px; }
  button { background: #2a2a33; color: #ddd; border: 0; border-radius: 4px; padding: 5px 11px; cursor: pointer; font: inherit; font-size: 13px; }
  button:hover { background: #363642; }
  button.on { background: var(--accent); color: #fff; }
  #error { display: none; margin: 12px 20px 0; padding: 8px 12px; border-radius: 6px; background: rgba(160,24,48,.9); color: #fff; font: 12px ui-monospace, Menlo, monospace; }
  #error.on { display: block; }
  main#grid { display: grid; gap: 18px; padding: 24px; width: max-content; grid-template-columns: repeat(var(--wcols, 3), 520px); }
  .tile { display: flex; flex-direction: column; min-width: 0; min-height: 0; background: #17171d; border: 1px solid #23232b; border-radius: 8px; overflow: hidden; }
  .tile.hidden { display: none; }
  .tile.is-live { border-color: rgba(240,45,94,.55); }
  .thead { display: flex; align-items: center; gap: 8px; padding: 8px 10px 2px; min-width: 0; }
  .dot { width: 9px; height: 9px; border-radius: 50%; flex: none; background: #8b8b98; }
  .dot.passed { background: #4ade80; } .dot.bugs { background: #fbbf24; } .dot.failed { background: #f87171; }
  .dot.live { margin: 0; } .dot.never-run { background: #3a3a44; }
  .title { color: #f1f1f4; font-weight: 600; text-decoration: none; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; cursor: pointer; }
  .title:hover { text-decoration: underline; }
  body.embed .title { cursor: default; } body.embed .title:hover { text-decoration: none; }
  .meta { color: #8a8a96; font-size: 12px; white-space: nowrap; margin-left: auto; padding-left: 8px; }
  body.embed .meta { font-size: 14px; }
  .note { padding: 0 10px 6px 27px; color: #9a9aa6; font-size: 12px; min-height: 18px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  body.embed .note { font-size: 14px; }
  .body { position: relative; background: #0c0c10; aspect-ratio: 16 / 10; width: 100%; flex: none; }
  .body iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: #0c0c10; pointer-events: none; }
  .poster { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
    padding: 12px 18px; text-align: center; color: #8a8a96; }
  .icon { font-size: 34px; line-height: 1; }
  .icon.passed { color: #4ade80; } .icon.bugs { color: #fbbf24; } .icon.failed { color: #f87171; } .icon.live { color: var(--accent); }
  .poster .bugtitle { color: #cfcfd6; font-size: 12px; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .poster .why { font-size: 12px; }
  .poster .msg { color: #f87171; font-size: 12px; max-width: 100%; word-break: break-word; }
  body.embed .poster .bugtitle, body.embed .poster .why, body.embed .poster .msg { font-size: 14px; }
  body.embed .poster button { display: none; }
  @keyframes pulse { 50% { opacity: .35; } }
  /* A finished run's last frame, drawn once by the relay, under a small status badge. */
  .body img.thumb { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; background: #0c0c10; }
  .poster.on-thumb { inset: auto auto 10px 10px; flex-direction: row; gap: 8px; padding: 5px 10px; border-radius: 8px;
    background: rgba(16,16,20,.82); border: 1px solid #2f2f39; max-width: calc(100% - 20px); }
  .poster.on-thumb .icon { font-size: 16px; }
  /* A loaded tile's playback: play/pause, a timeline to press or drag, the time, and Live while scrubbing a running one. */
  .tctl { display: none; align-items: center; gap: 8px; padding: 6px 10px; border-top: 1px solid #23232b; user-select: none; }
  .tile.has-player .tctl { display: flex; }
  .tctl button { padding: 3px 9px; min-width: 32px; }
  .tctl .track { position: relative; flex: 1; height: 20px; cursor: pointer; touch-action: none; }
  .tctl .track::before { content: ''; position: absolute; left: 0; right: 0; top: 8px; height: 4px; border-radius: 2px; background: #2f2f39; }
  .tctl .fill { position: absolute; left: 0; top: 8px; height: 4px; border-radius: 2px; background: var(--accent); }
  .tctl .head { position: absolute; top: 4px; width: 12px; height: 12px; margin-left: -6px; border-radius: 50%; background: #f1f1f4; }
  .tctl .ttime { color: #8a8a96; font-size: 12px; font-variant-numeric: tabular-nums; white-space: nowrap; }
  body.embed .tctl .ttime { font-size: 14px; }
  .tctl .golive { display: none; color: var(--accent); }
  .tctl.scrubbing.is-live .golive { display: inline-block; }
  .empty { padding: 40px 20px; color: #77777f; text-align: center; grid-column: 1 / -1; }
  body:not(.embed) .tile { user-select: none; }
</style>
</head>
<body>
<header id="head">
  <span class="proj" id="proj">Replay QA</span>
  <span class="live-count" id="liveCount"><i></i><span id="liveN">0</span> live</span>
  <span class="server" id="server" title="The QA server this project is on"></span>
  <span class="count" id="counts"></span>
  <span class="spacer"></span>
  <span class="chips" id="chips">
    <button data-filter="all" class="on">All</button><button data-filter="live">Live</button>
    <button data-filter="bugs">Bugs</button><button data-filter="failed">Failed</button>
  </span>
  <span class="zoom"><button id="zoomOut" title="Zoom out (−)">−</button><button id="zoomPct" title="Actual size (1)">100%</button><button id="zoomIn" title="Zoom in (+)">+</button><button id="zoomFit" title="Fit everything (0)">Fit</button></span>
  <span class="actions"><button id="follow" title="Stream any exploration or journey that starts running">Follow</button><button id="loadAll">Load all</button></span>
</header>
<div id="error"></div>
<div id="viewport"><div id="world"><main id="grid"><div class="empty" id="placeholder">Loading project…</div></main></div>
  <canvas id="minimap" aria-label="Minimap: click or drag to move the view"></canvas>
  <div id="hint">Pinch or ⌘/Ctrl-scroll to zoom · scroll or drag to pan · double-click a tile to focus it</div></div>
<script>
(() => {
  const params = new URLSearchParams(location.search)
  const projectId = decodeURIComponent(location.pathname.split('/')[2])
  const token = params.get('token')
  const embed = params.get('embed') === '1'
  const MAX_FRAMES = 12      // iframes alive at once
  const MAX_FINISHED_LOADING = 3  // finished runs read from the API at once (each is tens of pages)
  const AUTO_FINISHED = 4    // finished tiles that load without a click
  if (embed) document.body.classList.add('embed')

  const q = (extra = '') => `${extra ? extra + '&' : ''}token=${encodeURIComponent(token)}`
  const post = (path, body) => fetch(`${path}?${q()}`, { method: 'POST', body: JSON.stringify(body) }).then(async r => ({ ok: r.ok, data: await r.json() }))
  const $ = id => document.getElementById(id)
  const grid = $('grid')

  /** tile key -> { el, parts, tile, state: 'idle'|'starting'|'loaded'|'error', error, iframe, ranAt } */
  const views = new Map()
  /** tile keys waiting for a loading slot, in order. */
  let queue = []
  let following = params.get('follow') !== '0'
  let filter = 'all'
  let tiles = []
  let seeded = false
  let lastOverview = null

  const fmtDuration = s => (s == null ? '' : s >= 60 ? `${Math.floor(s / 60)}m ${Math.round(s % 60)}s` : `${Math.round(s)}s`)
  const STATUS = {
    live: ['●', 'live'], passed: ['✓', 'passed'], bugs: ['!', 'bugs'], failed: ['✕', 'failed'],
    infra: ['⚠', 'incomplete'], incomplete: ['…', 'incomplete'], 'never-run': ['–', 'never-run'],
  }
  const text = (tag, cls, content) => { const e = document.createElement(tag); if (cls) e.className = cls; if (content != null) e.textContent = content; return e }

  // ------------------------------------------------------------- tiles
  function createView(tile) {
    const el = text('article', 'tile')
    const head = text('div', 'thead')
    const dot = text('i', 'dot')
    const title = text('a', 'title')
    const meta = text('span', 'meta')
    head.append(dot, title, meta)
    const note = text('div', 'note')
    const body = text('div', 'body')
    const tctl = text('div', 'tctl')
    const play = text('button', 'tplay', '▶')
    const track = text('div', 'track')
    const fill = text('div', 'fill')
    const knob = text('div', 'head')
    track.append(fill, knob)
    const time = text('span', 'ttime')
    const golive = text('button', 'golive', '● Live')
    tctl.append(play, track, time, golive)
    el.append(head, note, body, tctl)
    const view = { el, parts: { dot, title, meta, note, body, ctl: { tctl, play, track, fill, knob, time } }, tile, state: 'idle', error: null, iframe: null, loadedAt: 0 }
    play.addEventListener('click', () => { ctlOf(view)?.playPause(); syncControls(view) })
    golive.addEventListener('click', () => { ctlOf(view)?.follow(); syncControls(view) })
    // Press or drag on the timeline: the tile shows that moment.
    let scrubPointer = null
    const scrubAt = e => { const r = track.getBoundingClientRect(); seekTile(view, (e.clientX - r.left) / r.width) }
    track.addEventListener('pointerdown', e => { e.stopPropagation(); scrubPointer = e.pointerId; try { track.setPointerCapture(e.pointerId) } catch {} scrubAt(e) })
    track.addEventListener('pointermove', e => { if (e.pointerId === scrubPointer) scrubAt(e) })
    track.addEventListener('pointerup', () => { scrubPointer = null })
    track.addEventListener('pointercancel', () => { scrubPointer = null })
    title.addEventListener('click', e => {
      if (embed || !view.tile.recordingId) return
      e.preventDefault()
      window.open(`/player/${encodeURIComponent(view.tile.recordingId)}?mode=auto&chrome=1&${q()}`, '_blank')
    })
    return view
  }

  /** Header text and the poster follow the tile's data; the iframe is never touched here. */
  function update(view, tile) {
    view.tile = tile
    const { dot, title, meta, note, body } = view.parts
    const [icon, label] = STATUS[tile.status] ?? STATUS.incomplete
    view.el.classList.toggle('is-live', tile.isLive)
    dot.className = `dot ${tile.status}`
    title.textContent = tile.title
    title.title = tile.recordingId ? 'Open the full player' : tile.title
    const loaded = tile.loaded
    const bits = []
    const duration = tile.durationSeconds != null ? fmtDuration(tile.durationSeconds) : loaded && loaded.durationMs ? fmtDuration(loaded.durationMs / 1000) : ''
    if (duration) bits.push(duration)
    if (tile.bugs) bits.push(`${tile.bugs} bug${tile.bugs === 1 ? '' : 's'}`)
    if (loaded) bits.push(`${loaded.eventCount.toLocaleString()} events`)
    meta.textContent = bits.join(' · ')
    note.textContent = loaded?.note?.text ?? (tile.isLive ? 'Starting…' : tile.goal ?? '')
    if (loaded?.meta?.width && loaded.meta.height) body.style.aspectRatio = `${loaded.meta.width} / ${loaded.meta.height}`
    // The relay could not read the recording after all: back to a poster that says why, with Retry.
    if (loaded?.status === 'error' && view.state === 'loaded') {
      view.iframe?.remove()
      view.iframe = null
      view.el.classList.remove('has-player')
      view.state = 'error'
      view.error = loaded.error
    }
    renderBody(view, icon, label)
  }

  function renderBody(view, icon, label) {
    const { body } = view.parts
    const tile = view.tile
    if (view.state === 'loaded' && view.iframe) return
    body.replaceChildren()
    const poster = text('div', 'poster')
    const thumb = thumbs.get(tile.key)
    if (view.state === 'idle' && thumb?.status === 'ready' && !tile.isLive) {
      // The run's last frame, with its status on a badge; the recording loads on a double-click or the button.
      if (!view.parts.thumb) {
        const img = Object.assign(document.createElement('img'), { className: 'thumb', alt: '' })
        // The tile takes the run's own shape.
        img.onload = () => { if (img.naturalWidth && !view.iframe) body.style.aspectRatio = `${img.naturalWidth} / ${img.naturalHeight}` }
        img.src = `${thumb.url}?${q()}`
        view.parts.thumb = img
      }
      poster.classList.add('on-thumb')
      poster.append(text('div', `icon ${tile.status}`, icon), text('div', 'why', tile.bugTitles[0] ?? label))
      if (tile.recordingId && embed) poster.append(text('div', 'why', '· double-click to play'))
      else if (tile.recordingId) {
        const load = text('button', '', 'Play')
        load.addEventListener('click', () => enqueue(tile.key, true))
        poster.append(load)
      }
      body.append(view.parts.thumb, poster)
      return
    }
    if (view.state === 'error') {
      poster.append(text('div', 'icon failed', '✕'), text('div', 'msg', view.error || 'Could not load this recording'))
      const retry = text('button', '', 'Retry')
      retry.addEventListener('click', () => { view.state = 'idle'; view.error = null; enqueue(tile.key, true) })
      poster.append(retry)
    } else if (view.state === 'starting' || queue.includes(tile.key)) {
      poster.append(text('div', 'icon', '…'), text('div', 'why', view.state === 'starting' ? 'Loading recording…' : 'Waiting for a loading slot…'))
    } else {
      poster.append(text('div', `icon ${tile.status}`, icon), text('div', 'why', tile.status === 'never-run' ? 'This journey has not run yet' : label + (tile.reason ? ` · ${tile.reason}` : '')))
      for (const t of tile.bugTitles.slice(0, 2)) poster.append(text('div', 'bugtitle', t))
      if (tile.recordingId && embed) poster.append(text('div', 'why', 'Double-click to load'))
      else if (tile.recordingId) {
        const load = text('button', '', 'Load recording')
        load.addEventListener('click', () => enqueue(tile.key, true))
        poster.append(load)
      }
    }
    body.append(poster)
  }

  /** Create, update, drop and place tiles from an overview; existing nodes (and their iframes) are never moved. */
  function reconcile(data) {
    const visible = data.tiles
    tiles = visible
    const keys = new Set(visible.map(t => t.key))
    for (const [key, view] of views) {
      if (keys.has(key)) continue
      view.el.remove()
      views.delete(key)
      queue = queue.filter(k => k !== key)
    }
    const prev = $('placeholder')
    if (prev) prev.remove()
    visible.forEach((tile, i) => {
      let view = views.get(tile.key)
      if (!view) {
        view = createView(tile)
        views.set(tile.key, view)
        // Before the next existing tile in order, so nodes already placed stay where they are.
        const next = visible.slice(i + 1).map(t => views.get(t.key)).find(Boolean)
        grid.insertBefore(view.el, next ? next.el : null)
      }
      update(view, tile)
    })
    if (!visible.length) {
      grid.replaceChildren(Object.assign(text('div', 'empty', data.error ? '' : 'No journeys or explorations yet'), { id: 'placeholder' }))
    }
    applyFilter()
    layout()
    drawMinimap()
  }

  function applyFilter() {
    for (const [, view] of views) {
      const t = view.tile
      const show = filter === 'all' || (filter === 'live' && t.isLive) || (filter === 'bugs' && t.status === 'bugs') || (filter === 'failed' && (t.status === 'failed' || t.status === 'infra'))
      view.el.classList.toggle('hidden', !show)
    }
    layout()
  }

  function layout() {
    const n = Math.max(1, [...views.values()].filter(v => !v.el.classList.contains('hidden')).length)
    grid.style.setProperty('--wcols', Math.max(1, Math.min(n, Math.ceil(Math.sqrt(n * 1.6)))))
  }

  // ----------------------------------------------------------- playback
  // Each loaded tile's player (same origin) is driven through its window.__ctl.
  const clock = ms => {
    const sec = Math.max(0, Math.round(ms / 1000))
    return `${Math.floor(sec / 60)}:${String(sec % 60).padStart(2, '0')}`
  }
  function ctlOf(view) {
    try { return view.iframe?.contentWindow?.__ctl?.timeline ? view.iframe.contentWindow.__ctl : null } catch { return null }
  }
  function syncControls(view) {
    const c = ctlOf(view)
    const tl = c ? c.timeline() : null
    view.el.classList.toggle('has-player', Boolean(tl))
    if (!tl) return
    const { tctl, play, fill, knob, time } = view.parts.ctl
    const at = tl.total > 0 ? Math.max(0, Math.min(1, tl.t / tl.total)) : 1
    fill.style.width = `${at * 100}%`
    knob.style.left = `${at * 100}%`
    time.textContent = `${clock(tl.t)} / ${clock(tl.total)}`
    play.textContent = tl.scrubbing && !tl.paused ? '❚❚' : '▶'
    tctl.classList.toggle('scrubbing', tl.scrubbing)
    tctl.classList.toggle('is-live', tl.live)
  }
  /** Show the moment at `fraction` of the tile's timeline. */
  function seekTile(view, fraction) {
    const c = ctlOf(view)
    if (!c) return
    c.scrubTo(Math.max(0, Math.min(1, fraction)) * c.timeline().total)
    syncControls(view)
  }
  setInterval(() => { for (const [, view] of views) if (view.iframe) syncControls(view) }, 250)

  // --------------------------------------------------------- thumbnails
  // Finished runs that are not playing show their last frame, which the relay draws once per run
  // (the QA API keeps no screenshot). Asked for in order, a few at a time; pending ones are asked again.
  /** tile key -> { status: 'pending'|'ready'|'error', url, askedAt } */
  const thumbs = new Map()
  let thumbAsks = 0
  async function askThumb(view) {
    const t = view.tile
    thumbAsks++
    thumbs.set(t.key, { ...(thumbs.get(t.key) ?? { status: 'pending', url: null }), askedAt: Date.now() })
    try {
      const res = await post('/qa/thumbnail', { projectId, kind: t.kind, sourceId: t.sourceId, title: t.title, goal: t.goal })
      if (!res.ok) throw new Error(res.data.error)
      thumbs.set(t.key, { status: res.data.status, url: res.data.url, askedAt: Date.now() })
      if (res.data.status === 'ready' && views.get(t.key) === view) update(view, view.tile)
    } catch {
      thumbs.set(t.key, { status: 'error', url: null, askedAt: Date.now() })
    } finally {
      thumbAsks--
    }
  }
  function pumpThumbs() {
    for (const tile of tiles) {
      if (thumbAsks >= 4) return
      const view = views.get(tile.key)
      if (!view || tile.isLive || !tile.recordingId || tile.status === 'never-run' || view.iframe) continue
      const known = thumbs.get(tile.key)
      if (known && (known.status !== 'pending' || Date.now() - known.askedAt < 3000)) continue
      askThumb(view)
    }
  }
  setInterval(pumpThumbs, 1000)

  // ------------------------------------------------------------ loading
  const frames = () => [...views.values()].filter(v => v.iframe).length
  /** Finished recordings still being read: the expensive kind, capped. */
  const finishedLoading = () => [...views.values()].filter(v => !v.tile.isLive && (v.state === 'starting' || (v.state === 'loaded' && v.tile.loaded?.status === 'loading'))).length

  function enqueue(key, front = false) {
    const view = views.get(key)
    if (!view || view.state === 'starting' || view.state === 'loaded' || !view.tile.recordingId) return
    if (!queue.includes(key)) front ? queue.unshift(key) : queue.push(key)
    update(view, view.tile)
    pump()
  }

  function pump() {
    while (queue.length && finishedLoading() < MAX_FINISHED_LOADING) {
      if (frames() >= MAX_FRAMES && !evictOne()) break
      const key = queue.shift()
      const view = views.get(key)
      if (view && view.state !== 'starting' && view.state !== 'loaded') start(view)
    }
  }

  /** Free a frame by returning the oldest finished tile to its poster. */
  function evictOne() {
    const victim = [...views.values()].filter(v => v.iframe && !v.tile.isLive).sort((a, b) => a.loadedAt - b.loadedAt)[0]
    if (!victim) return false
    victim.iframe.remove()
    victim.iframe = null
    victim.el.classList.remove('has-player')
    victim.state = 'idle'
    update(victim, victim.tile)
    return true
  }

  async function start(view) {
    const tile = view.tile
    view.state = 'starting'
    view.error = null
    update(view, tile)
    try {
      const res = await post('/qa/watch', { projectId, kind: tile.kind, sourceId: tile.sourceId, title: tile.title, goal: tile.goal })
      if (!res.ok) throw new Error(res.data.error || 'The relay could not start this recording')
      const frame = document.createElement('iframe')
      frame.src = `/player/${encodeURIComponent(res.data.recording.id)}?mode=auto&tile=1&chrome=0&sub=0&${q()}`
      view.parts.body.replaceChildren(frame)
      view.iframe = frame
      view.state = 'loaded'
      view.loadedAt = Date.now()
    } catch (err) {
      view.state = 'error'
      view.error = err.message
    }
    update(view, view.tile)
    pump()
  }

  /** Live tiles start at once and in parallel (frames permitting); a few finished ones follow. */
  function autoLoad() {
    for (const tile of tiles) {
      const view = views.get(tile.key)
      if (view && tile.isLive && view.state === 'idle' && tile.recordingId && frames() < MAX_FRAMES && !queue.includes(tile.key)) start(view)
    }
    if (!seeded && tiles.length) {
      seeded = true
      const finished = tiles.filter(t => !t.isLive && t.recordingId)
      // The rest load when focused (double-click), so frames are not spent on tiles nobody looks at.
      for (const t of finished.slice(0, embed ? MAX_FRAMES : AUTO_FINISHED)) enqueue(t.key)
    }
  }

  // ------------------------------------------------------------- header
  function header(data) {
    $('proj').textContent = data.project ? data.project.name : projectId
    $('server').textContent = data.server ? new URL(data.server).host : ''
    $('server').classList.toggle('on', Boolean(data.server))
    $('liveN').textContent = data.counts.live
    $('liveCount').classList.toggle('on', data.counts.live > 0)
    const passed = data.tiles.filter(t => t.status === 'passed').length
    $('counts').replaceChildren(
      ...[[passed, 'passed'], [data.counts.bugs, 'bugs'], [data.counts.failed, 'failed']].flatMap(([n, label], i) => {
        const b = text('b', '', String(n))
        return [i ? ' · ' : '', b, ` ${label}`]
      }),
    )
    $('follow').classList.toggle('on', following)
    $('follow').textContent = following ? 'Following' : 'Follow'
    const err = $('error')
    err.textContent = data.error ? `⚠ ${data.error}` : ''
    err.classList.toggle('on', Boolean(data.error))
  }

  $('chips').addEventListener('click', e => {
    const f = e.target.dataset?.filter
    if (!f) return
    filter = f
    for (const b of $('chips').children) b.classList.toggle('on', b.dataset.filter === f)
    applyFilter()
  })
  $('loadAll').addEventListener('click', () => {
    for (const t of tiles) if (!t.isLive) enqueue(t.key)
  })
  $('follow').addEventListener('click', async () => {
    following = !following
    $('follow').classList.toggle('on', following)
    $('follow').textContent = following ? 'Following' : 'Follow'
    await post('/qa/follow', { projectId, on: following })
  })

  // ------------------------------------------------------------- camera
  // The browser view is a canvas: #world holds the grid at a fixed size and is moved by one transform.
  // Players are pointer-events: none, so every gesture over them reaches the viewport.
  const viewport = $('viewport')
  const world = $('world')
  const MIN_ZOOM = 0.08
  const MAX_ZOOM = 4
  const cam = { x: 0, y: 0, k: 1 }
  /** Until the person moves the camera it keeps everything in view as tiles come and go. */
  let autoFit = true

  const clampZoom = k => Math.min(MAX_ZOOM, Math.max(MIN_ZOOM, k))
  function apply(glide = false) {
    world.classList.toggle('glide', glide)
    world.style.transform = `translate(${cam.x}px, ${cam.y}px) scale(${cam.k})`
    viewport.style.backgroundSize = `${24 * cam.k}px ${24 * cam.k}px`
    viewport.style.backgroundPosition = `${cam.x}px ${cam.y}px`
    $('zoomPct').textContent = `${Math.round(cam.k * 100)}%`
    drawMinimap()
  }

  // ------------------------------------------------------------ minimap
  // Every tile in its status colour and the part of the canvas in view, in the bottom-right corner.
  const minimap = $('minimap')
  const MINI_COLORS = { live: '#F02D5E', passed: '#2f7d4f', bugs: '#b8892a', failed: '#a8444a', infra: '#a8444a', 'never-run': '#2c2c35' }
  /** Where the minimap sits in the viewport, in px, as last drawn. */
  let mini = null
  function drawMinimap() {
    const vw = viewport.clientWidth
    const vh = viewport.clientHeight
    const ww = grid.offsetWidth
    const wh = grid.offsetHeight
    if (!vw || !vh || !ww || !wh) return
    let w = Math.min(embed ? 300 : 220, vw * 0.22)
    let h = (w * wh) / ww
    if (h > vh * 0.3) { h = vh * 0.3; w = (h * ww) / wh }
    const s = w / ww
    const dpr = window.devicePixelRatio || 1
    minimap.style.width = `${w}px`
    minimap.style.height = `${h}px`
    if (minimap.width !== Math.round(w * dpr) || minimap.height !== Math.round(h * dpr)) {
      minimap.width = Math.round(w * dpr)
      minimap.height = Math.round(h * dpr)
    }
    const ctx = minimap.getContext('2d')
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0)
    ctx.clearRect(0, 0, w, h)
    for (const [, view] of views) {
      if (view.el.classList.contains('hidden')) continue
      ctx.fillStyle = view.tile.isLive ? MINI_COLORS.live : MINI_COLORS[view.tile.status] ?? '#3a3a44'
      ctx.fillRect(view.el.offsetLeft * s, view.el.offsetTop * s, Math.max(1, view.el.offsetWidth * s - 1), Math.max(1, view.el.offsetHeight * s - 1))
    }
    // The view, clipped to the map.
    const x = Math.max(0, (-cam.x / cam.k) * s)
    const y = Math.max(0, (-cam.y / cam.k) * s)
    const r = Math.min(w, ((vw - cam.x) / cam.k) * s)
    const b = Math.min(h, ((vh - cam.y) / cam.k) * s)
    ctx.strokeStyle = '#f1f1f4'
    ctx.lineWidth = 1.5
    if (r > x && b > y) ctx.strokeRect(x + 0.75, y + 0.75, Math.max(0, r - x - 1.5), Math.max(0, b - y - 1.5))
    mini = { x: vw - 12 - w, y: vh - 12 - h, w, h }
  }
  /** Centre the view on the point at (u, v) of the minimap, fractions of its width and height. */
  function centerOnMinimap(u, v) {
    autoFit = false
    cam.x = viewport.clientWidth / 2 - Math.max(0, Math.min(1, u)) * grid.offsetWidth * cam.k
    cam.y = viewport.clientHeight / 2 - Math.max(0, Math.min(1, v)) * grid.offsetHeight * cam.k
    apply()
  }
  /** Zoom by `factor`, keeping the viewport point (px, py) still. */
  function zoomAt(factor, px, py, glide = false) {
    const k = clampZoom(cam.k * factor)
    cam.x = px - (px - cam.x) * (k / cam.k)
    cam.y = py - (py - cam.y) * (k / cam.k)
    cam.k = k
    apply(glide)
  }
  /** Fit a world-space rectangle in the viewport, never above `maxK`. */
  function frame(x, y, w, h, maxK, glide) {
    const vw = viewport.clientWidth
    const vh = viewport.clientHeight
    if (!vw || !vh || !w || !h) return
    const pad = 24
    cam.k = clampZoom(Math.min((vw - pad * 2) / w, (vh - pad * 2) / h, maxK))
    cam.x = (vw - w * cam.k) / 2 - x * cam.k
    cam.y = (vh - h * cam.k) / 2 - y * cam.k
    apply(glide)
  }
  const fitAll = (glide = false) => frame(0, 0, grid.offsetWidth, grid.offsetHeight, 1, glide)
  const center = () => [viewport.clientWidth / 2, viewport.clientHeight / 2]
  const moved = () => { autoFit = false }
  /** The tile under a viewport point (fractions), and the playback control there if any. */
  function hit(fx, fy) {
    const r = viewport.getBoundingClientRect()
    const target = document.elementFromPoint(r.left + fx * r.width, r.top + fy * r.height)
    const el = target?.closest('.tile')
    const view = el ? [...views.values()].find(v => v.el === el) : null
    const control = target?.closest('.track') ? 'track' : target?.closest('.tplay') ? 'play' : target?.closest('.golive') ? 'live' : target?.closest('.tctl') ? 'bar' : null
    return { el, view, control }
  }
  /** Bring a tile up close, loading its recording if it shows a poster. */
  function focusTile(el) {
    moved()
    frame(el.offsetLeft, el.offsetTop, el.offsetWidth, el.offsetHeight, MAX_ZOOM, true)
    const view = [...views.values()].find(v => v.el === el)
    if (view && view.state === 'idle') enqueue(view.tile.key, true)
    return view?.tile.title ?? null
  }

  new ResizeObserver(() => { if (autoFit) fitAll(); else drawMinimap() }).observe(grid)
  new ResizeObserver(() => { if (autoFit) fitAll(); else drawMinimap() }).observe(viewport)

  // The terminal's camera (the relay evaluates these in the screencast): points and distances are
  // fractions of the viewport, so the caller needs no pixels.
  let gesture = null
  // Each answers the camera's state: the zoom, and where the minimap sits (fractions of the viewport).
  const camState = (extra = {}) => {
    const vw = viewport.clientWidth || 1
    const vh = viewport.clientHeight || 1
    return { k: cam.k, minimap: mini && { x: mini.x / vw, y: mini.y / vh, w: mini.w / vw, h: mini.h / vh }, ...extra }
  }
  window.__canvas = {
    state: () => camState(),
    zoom(factor, fx = 0.5, fy = 0.5) { moved(); zoomAt(factor, fx * viewport.clientWidth, fy * viewport.clientHeight); return camState() },
    pan(dx, dy) { moved(); cam.x += dx * viewport.clientWidth; cam.y += dy * viewport.clientHeight; apply(); return camState() },
    focus(fx, fy) {
      const { el, control } = hit(fx, fy)
      if (control) return camState()
      if (el) return camState({ title: focusTile(el) })
      autoFit = true
      fitAll(true)
      return camState()
    },
    minimap(u, v) { centerOnMinimap(u, v); return camState() },
    /**
     * One pointer gesture from the terminal, as it stands: where it began, where it is, whether it
     * ended. Where it began decides it: a tile's timeline scrubs, its buttons press, anywhere else pans.
     * Only the newest state of a gesture may arrive, so each carries all of it.
     */
    gesture(id, sx, sy, x, y, done) {
      if (!gesture || gesture.id !== id) {
        const { view, control } = hit(sx, sy)
        if (view && control === 'track') gesture = { id, kind: 'scrub', view }
        else if (view && (control === 'play' || control === 'live')) {
          gesture = { id, kind: 'pressed' }
          control === 'play' ? ctlOf(view)?.playPause() : ctlOf(view)?.follow()
          syncControls(view)
        } else if (control) gesture = { id, kind: 'pressed' }
        else gesture = { id, kind: 'pan', x0: cam.x, y0: cam.y }
      }
      const g = gesture
      if (g.kind === 'scrub') {
        const r = viewport.getBoundingClientRect()
        const t = g.view.parts.ctl.track.getBoundingClientRect()
        seekTile(g.view, (r.left + x * r.width - t.left) / t.width)
      } else if (g.kind === 'pan' && (x !== sx || y !== sy)) {
        moved()
        cam.x = g.x0 + (x - sx) * viewport.clientWidth
        cam.y = g.y0 + (y - sy) * viewport.clientHeight
        apply()
      }
      if (done) gesture = null
      return camState()
    },
    fit() { autoFit = true; fitAll(true); return camState() },
    actual() { moved(); zoomAt(1 / cam.k, ...center(), true); return camState() },
  }

  if (!embed) {
    $('zoomIn').addEventListener('click', () => { moved(); zoomAt(1.25, ...center(), true) })
    $('zoomOut').addEventListener('click', () => { moved(); zoomAt(0.8, ...center(), true) })
    $('zoomPct').addEventListener('click', () => { moved(); zoomAt(1 / cam.k, ...center(), true) })
    $('zoomFit').addEventListener('click', () => { autoFit = true; fitAll(true) })

    const local = e => { const r = viewport.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top] }

    // Trackpad pinch and Ctrl/⌘-scroll arrive as wheel events with ctrlKey; a plain scroll pans.
    viewport.addEventListener('wheel', e => {
      e.preventDefault()
      moved()
      const unit = e.deltaMode === 1 ? 16 : e.deltaMode === 2 ? viewport.clientHeight : 1
      if (e.ctrlKey || e.metaKey) {
        const dy = Math.max(-60, Math.min(60, e.deltaY * unit))
        zoomAt(Math.exp(-dy * 0.01), ...local(e))
      } else {
        cam.x -= (e.shiftKey && !e.deltaX ? e.deltaY : e.deltaX) * unit
        cam.y -= (e.shiftKey && !e.deltaX ? 0 : e.deltaY) * unit
        apply()
      }
    }, { passive: false })

    // Safari reports a trackpad pinch as gesture events instead.
    let gestureK = 1
    viewport.addEventListener('gesturestart', e => { e.preventDefault(); gestureK = cam.k })
    viewport.addEventListener('gesturechange', e => {
      e.preventDefault()
      moved()
      zoomAt(gestureK * e.scale / cam.k, ...local(e))
    })
    viewport.addEventListener('gestureend', e => e.preventDefault())

    // Drag with one pointer to pan; pinch with two (touch screens) to zoom and pan together.
    const pointers = new Map()
    let last = null
    const pinchState = () => {
      const [a, b] = [...pointers.values()]
      return { mx: (a[0] + b[0]) / 2, my: (a[1] + b[1]) / 2, d: Math.hypot(a[0] - b[0], a[1] - b[1]) || 1 }
    }
    // Click or drag on the minimap to move the view there.
    let miniPointer = null
    const onMinimap = e => {
      const r = minimap.getBoundingClientRect()
      centerOnMinimap((e.clientX - r.left) / r.width, (e.clientY - r.top) / r.height)
    }
    minimap.addEventListener('pointerdown', e => {
      e.stopPropagation()
      miniPointer = e.pointerId
      try { minimap.setPointerCapture(e.pointerId) } catch {}
      onMinimap(e)
    })
    minimap.addEventListener('pointermove', e => { if (e.pointerId === miniPointer) onMinimap(e) })
    const miniLift = e => { if (e.pointerId === miniPointer) miniPointer = null }
    minimap.addEventListener('pointerup', miniLift)
    minimap.addEventListener('pointercancel', miniLift)
    minimap.addEventListener('dblclick', e => e.stopPropagation())

    viewport.addEventListener('pointerdown', e => {
      if (e.button > 1 || e.target.closest('button, a, .tctl')) return
      viewport.setPointerCapture(e.pointerId)
      pointers.set(e.pointerId, local(e))
      last = pointers.size === 2 ? pinchState() : null
      viewport.classList.add('panning')
    })
    viewport.addEventListener('pointermove', e => {
      const prev = pointers.get(e.pointerId)
      if (!prev) return
      const p = local(e)
      pointers.set(e.pointerId, p)
      moved()
      if (pointers.size === 1) {
        cam.x += p[0] - prev[0]
        cam.y += p[1] - prev[1]
        apply()
      } else if (pointers.size === 2 && last) {
        const now = pinchState()
        cam.x += now.mx - last.mx
        cam.y += now.my - last.my
        zoomAt(now.d / last.d, now.mx, now.my)
        last = now
      }
    })
    const lift = e => {
      pointers.delete(e.pointerId)
      last = pointers.size === 2 ? pinchState() : null
      if (!pointers.size) viewport.classList.remove('panning')
    }
    viewport.addEventListener('pointerup', lift)
    viewport.addEventListener('pointercancel', lift)

    // Double-click a tile to bring it up close; double-click the background to see everything.
    viewport.addEventListener('dblclick', e => {
      if (e.target.closest('button, a, .tctl')) return
      const el = e.target.closest('.tile')
      if (!el) { autoFit = true; fitAll(true); return }
      focusTile(el)
    })

    window.addEventListener('keydown', e => {
      if (e.metaKey || e.ctrlKey || e.altKey) {
        // Keep ⌘/Ctrl +/−/0 on the canvas rather than zooming the whole page.
        if (!['=', '+', '-', '0'].includes(e.key)) return
        e.preventDefault()
      }
      if (e.key === '=' || e.key === '+') { moved(); zoomAt(1.25, ...center(), true) }
      else if (e.key === '-' || e.key === '_') { moved(); zoomAt(0.8, ...center(), true) }
      else if (e.key === '0') { autoFit = true; fitAll(true) }
      else if (e.key === '1') { moved(); zoomAt(1 / cam.k, ...center(), true) }
    })
  }

  // --------------------------------------------------------------- poll
  async function refresh() {
    try {
      const res = await fetch(`/qa/overview?${q(`project=${encodeURIComponent(projectId)}`)}`)
      const data = await res.json()
      if (!res.ok) throw new Error(data.error || `The relay answered ${res.status}`)
      if (!data || !data.tiles) throw new Error('No project data yet')
      lastOverview = data
      header(data)
      reconcile(data)
      autoLoad()
      pump()
    } catch (err) {
      const e = $('error')
      e.textContent = `⚠ ${err.message}`
      e.classList.add('on')
    }
    setTimeout(refresh, 3000)
  }

  ;(async () => {
    if (following) await post('/qa/follow', { projectId, on: true }).catch(() => {})
    refresh()
  })()
})()
</script>
</body>
</html>
